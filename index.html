<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BiswajitWeb — Pro Network & Portfolio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.2/anime.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..900;1,9..40,400..900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'DM Sans', sans-serif; overflow-x: hidden; background: #020617; color: #f8fafc; }
    .word, .letter { display: inline-block; }
    .glass { background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); }
    .profile-pill { transition: all 0.3s ease; }
    .profile-pill:hover { transform: translateY(-2px); border-color: rgba(99, 102, 241, 0.6); box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.3); }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="min-h-screen">

  <!-- TOP MARQUEE: ALL PROFILE NAMES VISIBLE ON TOPMOST HOME PAGE -->
  <div class="bg-indigo-950/80 border-b border-indigo-900/50 py-2.5 px-4 sticky top-0 z-50 backdrop-blur-md">
    <div class="max-w-7xl mx-auto flex items-center justify-between gap-4 overflow-x-auto no-scrollbar">
      <div class="flex items-center gap-2 flex-shrink-0">
        <span class="relative flex h-2.5 w-2.5">
          <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
          <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-emerald-500"></span>
        </span>
        <span class="text-xs font-bold tracking-wider text-indigo-300 uppercase">Active Crew Matrix:</span>
      </div>
      <div class="flex items-center gap-3 text-xs font-semibold text-slate-300" id="topProfileTicker"></div>
    </div>
  </div>

  <!-- MAIN NAVIGATION -->
  <header class="border-b border-slate-800/80 bg-slate-950/80 backdrop-blur sticky top-[41px] z-40">
    <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-2 cursor-pointer" onclick="switchView('landing')">
        <div class="bg-gradient-to-br from-indigo-500 to-emerald-400 p-2 rounded-xl text-slate-950 font-extrabold text-sm shadow-lg shadow-indigo-500/20">BW</div>
        <span class="font-bold text-lg tracking-tight">Biswajit <span class="text-indigo-400">Web</span></span>
      </div>

      <!-- Nav Actions & Login State -->
      <div class="flex items-center gap-3">
        <div id="navActions" class="hidden items-center gap-3">
          <span id="navRoleBadge" class="text-xs bg-indigo-950 text-indigo-400 px-3 py-1 rounded-full border border-indigo-800/60"></span>
          <button type="button" onclick="switchView('dashboard')" class="text-xs font-semibold bg-indigo-600/20 hover:bg-indigo-600/40 text-indigo-300 border border-indigo-500/30 px-3 py-1.5 rounded-lg transition">
            Dashboard
          </button>
          <button type="button" onclick="logout()" class="text-sm text-slate-400 hover:text-white transition">Logout</button>
        </div>
        <button type="button" onclick="switchView('login')" id="loginNavBtn" class="text-xs font-semibold bg-white/5 hover:bg-white/10 border border-white/10 px-4 py-2 rounded-xl transition">
          Portal Login
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 py-8">

    <!-- ================= VIEW 1: LANDING & PORTFOLIO HOME ================= -->
    <div id="view-landing" class="space-y-16 pb-20">

      <!-- HERO SECTION -->
      <div class="text-center pt-8 pb-4">
        <div class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-indigo-950/80 border border-indigo-800/60 text-indigo-300 text-xs font-medium mb-6 hero-badge">
          <i data-lucide="sparkles" class="w-3.5 h-3.5 text-indigo-400"></i> Next-Gen Web Engineering & Creative Graphics
        </div>
        <h1 class="text-4xl sm:text-6xl font-black tracking-tight mb-4" id="heroHeading">
          <span class="word">Engineering</span> <span class="word text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 via-purple-300 to-emerald-400">Digital Mastery</span>
        </h1>
        <p class="text-slate-400 text-base sm:text-lg max-w-2xl mx-auto hero-sub">
          High-performance web architecture, immersive graphics,
